<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 430" width="1054" height="430" font-family="Helvetica, Arial, sans-serif">
<title>Video search pipeline: indexing and query flow</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
<style>
.lane{fill:#f6f8fa;stroke:#d0d7de}
.lt{font-size:13px;font-weight:700;fill:#57606a;letter-spacing:.08em}
.b{fill:#fff;stroke:#2ea043;stroke-width:2}
.bm{fill:#eef7d9;stroke:#2ea043;stroke-width:2}
.bo{fill:#fff;stroke:#2ea043;stroke-width:2;stroke-dasharray:6 4}
.bd{fill:#1a1a1a;stroke:#1a1a1a;stroke-width:2}
.t{font-size:14px;font-weight:600;fill:#1a1a1a;text-anchor:middle}
.s{font-size:11px;fill:#57606a;text-anchor:middle}
.td{font-size:14px;font-weight:600;fill:#fff;text-anchor:middle}
.sd{font-size:11px;fill:#c9d1d9;text-anchor:middle}
.e{stroke:#555;stroke-width:1.8;fill:none;marker-end:url(#ar)}
.ed{stroke:#555;stroke-width:1.8;stroke-dasharray:5 4;fill:none;marker-end:url(#ar)}
</style>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<rect class="lane" x="12" y="14" width="1030" height="148" rx="10"/>
<text class="lt" x="28" y="38">1 · INDEXING (once per video)</text>
<rect class="lane" x="12" y="190" width="1030" height="226" rx="10"/>
<text class="lt" x="28" y="214">2 · QUERY (every search)</text>
<rect class="b" x="34" y="70" width="146" height="64" rx="8"/>
<text class="t" x="107.0" y="98">Video</text>
<text class="s" x="107.0" y="116">mp4 file</text>
<rect class="b" x="202" y="70" width="146" height="64" rx="8"/>
<text class="t" x="275.0" y="98">Fixed clips</text>
<text class="s" x="275.0" y="116">startSec, endSec</text>
<rect class="bm" x="370" y="70" width="146" height="64" rx="8"/>
<text class="t" x="443.0" y="98">Qwen3-VL-Embed</text>
<text class="s" x="443.0" y="116">Embedding-8B, vLLM</text>
<rect class="bm" x="538" y="70" width="146" height="64" rx="8"/>
<text class="t" x="611.0" y="98">Vectors</text>
<text class="s" x="611.0" y="116">one per clip + time range</text>
<rect class="bd" x="706" y="70" width="146" height="64" rx="8"/>
<text class="td" x="779.0" y="98">FAISS index</text>
<text class="sd" x="779.0" y="116">local, inner product</text>
<path class="e" d="M182,102.0 H199"/>
<path class="e" d="M350,102.0 H367"/>
<path class="e" d="M518,102.0 H535"/>
<path class="e" d="M686,102.0 H703"/>
<rect class="b" x="34" y="270" width="146" height="64" rx="8"/>
<text class="t" x="107.0" y="298">Text or image</text>
<text class="s" x="107.0" y="316">search query</text>
<rect class="bm" x="202" y="270" width="146" height="64" rx="8"/>
<text class="t" x="275.0" y="298">Same model</text>
<text class="s" x="275.0" y="316">embeds the query</text>
<rect class="bm" x="370" y="270" width="146" height="64" rx="8"/>
<text class="t" x="443.0" y="298">Query vector</text>
<text class="s" x="443.0" y="316">same vector space</text>
<rect class="bm" x="538" y="270" width="146" height="64" rx="8"/>
<text class="t" x="611.0" y="298">Top-k clips</text>
<text class="s" x="611.0" y="316">nearest neighbours</text>
<rect class="bo" x="706" y="270" width="146" height="64" rx="8"/>
<text class="t" x="779.0" y="298">Qwen3-VL-Rerank</text>
<text class="s" x="779.0" y="316">2B, optional re-score</text>
<rect class="b" x="874" y="270" width="146" height="64" rx="8"/>
<text class="t" x="947.0" y="298">Results</text>
<text class="s" x="947.0" y="316">thumbnails, times, timeline</text>
<path class="e" d="M182,302.0 H199"/>
<path class="e" d="M350,302.0 H367"/>
<path class="e" d="M518,302.0 H535"/>
<path class="e" d="M686,302.0 H703"/>
<path class="e" d="M854,302.0 H871"/>
<path class="ed" d="M779.0,136 V214.0 H611.0 V267"/>
<text class="s" x="725.0" y="206.0">search</text>
<text class="s" x="34" y="404" style="text-anchor:start">Every vector keeps the time range of its clip, so a search result is a timestamp you can jump to in the video.</text>
</svg>